<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Suivi des PFMP — consultation</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{border:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <iframe id="pfmpApp" title="Suivi des PFMP — consultation"></iframe>
  <script>
  (function(){
    'use strict';
    var frame=document.getElementById('pfmpApp');
    var gas='https://script.google.com/a/macros/lycee-les-eucalyptus.org/s/AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg/exec';
    var allowedPages={
      'suivi-conventions-public':true,
      'suivi-conventions-public-famille':true,
      'suivi-pfmp-classe-public':true,
      'book-entreprises-public-pfmp':true
    };
    function allowed(raw){
      try{
        var u=new URL(String(raw||''));
        if(u.protocol!=='https:'||
           !(u.hostname==='script.google.com'||/script\.googleusercontent\.com$/i.test(u.hostname))||
           !allowedPages[u.searchParams.get('page')||''])return null;
        var target=new URL(gas);
        u.searchParams.forEach(function(value,key){target.searchParams.append(key,value);});
        target.searchParams.set('wrapper','1');
        return target;
      }catch(e){return null;}
    }
    function initial(){
      var requested=new URL(location.href),page=requested.searchParams.get('page');
      if(!allowedPages[page||''])requested.searchParams.set('page','suivi-conventions-public');
      requested.protocol='https:';requested.hostname='script.google.com';requested.pathname=new URL(gas).pathname;
      return allowed(requested.toString());
    }
    window.addEventListener('message',function(ev){
      if(!ev.data||!/^EUC_PFMP_WRAPPER_/.test(String(ev.data.type||'')))return;
      if(ev.origin!=='null'&&
         !/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(ev.origin)&&
         ev.origin!=='https://script.google.com')return;
      if(ev.data.type==='EUC_PFMP_WRAPPER_QUERY'){
        try{ev.source.postMessage({type:'EUC_PFMP_WRAPPER_READY'},'*');}catch(e){}
        return;
      }
      if(ev.data.type==='EUC_PFMP_WRAPPER_NAVIGATE'){
        var target=allowed(ev.data.url);
        if(target)frame.src=target.toString();
      }
    });
    frame.src=initial().toString();
  })();
  </script>
</body>
</html>
